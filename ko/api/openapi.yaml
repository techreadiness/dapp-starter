                        price:
                          $ref: '#/components/schemas/Decimal'
                          description: 판매된 품목의 판매가 기준 합산가가 반환됩니다. 여러 B2C 판매에서 서로 다른 가격으로 판매했더라도 각 개별 판매가가 하나로 합산됩니다.
                        amount:
                          type: integer
                          description: 판매된 품목의 수량이 반환됩니다.
                        currencyType:
                          type: string
                          description: 합산가의 환산 통화 기준이 반환됩니다.
                    description: 판매된 상품이 없는 경우 빈 목록이 반환됩니다.
          description: The request was successful, and the server has returned the requested resource in the response body.
      parameters:
      - in: query
        name: startDate
        style: form
        schema:
          $ref: '#/components/schemas/Long'
          type: number
          description: |-
            조회하고자 하는 시작 일시를 지정합니다.
            milliseconds 단위 UNIX timestamp
        explode: true
        required: true
        description: |-
          조회하고자 하는 시작 일시를 지정합니다.
          milliseconds 단위 UNIX timestamp
        allowReserved: false
      - in: header
        name: Content-Type
        style: simple
        schema:
          type: string
        explode: false
        required: true
        description: application/json
        allowReserved: false
      - in: query
        name: endDate
        style: form
        schema:
          $ref: '#/components/schemas/Long'
          type: number
          items:
            $ref: '#/components/schemas/Long'
          description: |-
            조회하고자 하는 시작 일시를 지정합니다.
            milliseconds 단위 UNIX timestamp
        explode: true
        required: false
        description: |-
          조회하고자 하는 종료 일시를 지정합니다. 미지정시 현재 시각을 기준으로 지정하게 됩니다.
          startDate가 1년전이라면 endDate는 반드시 지정되어야 하며 최대 기간은 1년입니다.
          milliseconds 단위 UNIX timestamp
        allowReserved: false
      - in: query
        name: saleIds
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Long'
        explode: true
        required: false
        description: 특정 판매식별자만으로 필터링하려면 B2C 판매 식별자를 지정하세요. ex) ...&saleIds=10,12,13
        allowReserved: false
      - in: query
        name: currencyType
        style: form
        schema:
          type: string
        explode: true
        required: false
        description: 환산가 유형을 지정하세요. 미지정하는 경우 USD가 기본 지정됩니다. (USD, KRW, JPY, TWD, THB, IDR, PHP, USDT)
        allowReserved: false
      description: |-
        `preview` `prod`

        B2C 판매량 통계를 기간별로 조회합니다. 특정 기간 중에 판매된 상품의 품목 기준 수량과 판매가 기준 환산가 집계를 제공하며 용도에 따라 기간을 1년 이내로 지정하여 월집계, 일집계, 시간집계 등의 용도로 응용할 수 있습니다.

        Note

        같은 파라미터에 대해 약 5초간의 갱신 지연이 있습니다. 5초 이내에 같은 파라미터로 지정한 경우 동일한 응답을 반환합니다.
        초당 10회 초과 호출하는 경우 429 Too Many Request 응답을 에러로 반환합니다. (타임윈도우 방식)
        판매 수량이 응답지연이 발생할 정도로 많은 경우 기간을 보다 짧게 지정하여 병렬 호출하는 방식을 사용하는 것이 좋습니다.
      operationId: 판매량통계조회
