                  - MAGENTA
                  description: |-
                    능력치를 표기할 때 표시할 색상을 지정합니다. 테마에 따라 지정한 색상을 명도와 채도를 조절하여 표시하며 가능하면 게임내 표기하는 색상을 지정하는 것이 유리합니다.

                    지정가능한 색상: YELLOW, GREEN, BLUE, MAGENTA, ORANGE, RED, GREY, NONE
                    (NONE은 따로 색깔은 지정하지 않음을 뜻하고 기본색상으로 표현됩니다.)
                unitType:
                  enum:
                  - NONE
                  - PERCENTAGE
                  - NUMERIC
                  - LEVEL
                  type: string
                  default: NONE
                  examples:
                  - LEVEL
                  description: |+
                    능력치를 어떤 형식으로 표현할지를 결정하여 지정합니다.

                    NONE: 입력한 수치 그대로 노출

                    PERCENTAGE: 100% 형식의 표시

                    NUMERIC: +100 형식으로 표시

                    LEVEL: 100Lv 형식으로 표시


                    예시는 abilities.value의 값을 100으로 지정했을 때 형식입니다.

                optionType:
                  enum:
                  - BASIC
                  - ENHANCE
                  - ADDITIONAL
                  - SMELTING
                  - CONSTRAINT
                  type: string
                  default: BASIC
                  examples:
                  - ENHANCE
                  description: |-
                    능력치의 옵션 분류를 지정합니다. 각 옵션 분류마다 사용자에게 표시되는 위치가 달라집니다.

                    BASIC: 기본 능력치 변경 사항

                    ENHANCE: 강화를 통해 변경된 능력 (강화 옵션으로 표기)

                    ADDITIONAL: 감정이나 소켓팅을 통해 변경된 능력 (추가 옵션으로 표기)

                    SMELTING: 제련이나 속성 부여를 통해 변경된 능력 (제련 옵션으로 표기)

                    CONSTRAINT: 변화에 의해 추가되거나 변경된 제약 조건 (제약 옵션으로 표기)
        required: true
        description: ''
