                  periodicType:
                    type: string
                    description: (since 25.7.10) 설정한 계정당 구매 가능 수량의 초기화 주기입니다. 설정하지 않았을 경우 'NONE' 으로 응답됩니다.
                  limitStockAmount:
                    $ref: '#/components/schemas/Long'
                    description: |-
                      등록 시 설정한 총 재고의 수량입니다. 수량만큼의 구매가 발생하면 매진 상태로 노출되며 더 이상 구매를 할 수 없는 상태가 됩니다.
                      총 재고의 수량은 판매 도중이나 매진일 때에도 변경이 가능합니다.
                  limitPurchaseCount:
                    type: integer
                    description: 등록된 상품의 한 계정당 구매할 수 있는 최대 개수입니다. periodicType을 이용해 기간별 구매 제한 개수를 초기화할 수 있습니다.
                  multiCurrencyPrice:
                    type: object
                    description: (since 25.7.10) 등록한 상품의 통화와 가격입니다.
                  limitMaxPurchasePerOnce:
                    type: integer
                    description: 등록된 상품의 한번의 결제로 구매할 수 있는 최대 개수입니다. 판매가격이나 상품의 특성에 따라 수량을 조절해야 사용자가 구매하는 과정에서 불필요한 오류가 발생하지 않을 수 있습니다. 최대 개수는 50개입니다.
                  nonRefundableCountryList:
                    type: array
                    items:
                      type: string
                    description: PARTIALLY_REFUNDABLE 환불 정책 일 때 환불이 불가능한 국가의 목록입니다.
          description: The request was successful, and the server has returned the requested resource in the response body.
      parameters:
      - $ref: '#/components/parameters/b2cSaleId'
      description: "`preview` `prod`\n\n판매 대기 중이거나 판매 중 또는 매진된 상황에서 일정이나 종료 시기, 재고, 설명 등을 수정할 수 있습니다. 상품의 구성을 직접적으로 수정하는 것은 불가하며 판매 개시 이후에는 이미 구매한 이력에 영향을 줄 수 있는 구매 가능 개수 초기화 설정과 판매 개시 시간의 변경을 할 수 없습니다. 변경이 불가한 대상을 수정해야 하는 사항이라면 조기 종료 처리 후 새로운 판매 등록을 해야 합니다.\n\nb2cSaleId 로는 판매 등록 후 반환 받은 id 값을 지정합니다. "
      operationId: 판매변경
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - requestId
              properties:
                title:
                  type: array
                  items:
                    type: object
                    required: []
                    properties:
                      lang:
                        type: string
                        description: 언어코드(en,ko,ja,th,zh)입니다.
                      contents:
                        type: string
                        description: 언어코드에 해당하는 상품의 이름입니다.
                  description: 사용자에게 노출할 판매 상품의 이름을 다국어로 지정합니다.
                resetAt:
                  $ref: '#/components/schemas/Timestamp'
                  description: periodicType의 초기화 주기를 실행할 기준 일시를 변경합니다. 판매 개시 이후에는 변경할 수 없으며 openedAt 보다 같거나 이전으로 설정해야 합니다.
                closedAt:
                  $ref: '#/components/schemas/Timestamp'
                  description: 판매 종료할 시간을 지정합니다. 판매가 종료되면 해당 상품은 더 이상 노출되지 않으며, 종료 직전에 구매를 시도한 경우 판매 종료 이후에도 구매가 될 수 있습니다.
                mediaUrl:
                  type: string
                  description: |-
                    상품의 커버 이미지 또는 영상의 URL을 "미디어 파일 업로드" 기능을 이용해 반환받은 URL을 지정합니다.
                    레티나, PC모드 지원을 위해 정방형 944 x 944 이상으로 등록하는 것을 권장합니다.
                openedAt:
                  $ref: '#/components/schemas/Timestamp'
                  description: 판매 게시 시간을 변경합니다. 판매 개시 이후에는 변경할 수 없으므로 판매를 조기 종료하고 재등록해야 합니다.
                mediaType:
                  type: string
                  description: 상품 커버로 등록할 대상의 유형을 지정합니다. (VIDEO, IMAGE)
                requestId:
                  type: string
                  description: 요청의 유일성을 보장하기 위한 5~36자 이내의 요청키, 중복요청이 발생하지 않도록 동일 요청에 대해서는 항상 동일 요청키로 지정해야 합니다.
                sectionId:
                  $ref: '#/components/schemas/Long'
                  description: 스토어에 설정한 section의 식별자를 지정하면 해당 영역에 게시됩니다. 미지정시 가장 첫 번째 섹션의 가장 첫 번째에 위치하게 됩니다.
                periodType:
                  type: string
                  description: |-
                    (deprecated 25.7.10) 계정당 구매 가능 수량 초기화 주기를 변경합니다. 판매 개시 이후에는 변경할 수 없습니다.
                    DAILY: 매일 초기화
                    WEEKLY: 매주 초기화
                    BI_WEEKLY: 격주 초기화
                    MONTHLY: 매달 초기화
                description:
                  type: array
                  items:
                    type: object
                    required: []
                    properties:
                      lang:
                        type: string
                        description: 언어코드(en,ko,ja,th,zh)입니다.
                      contents:
                        type: string
                        description: 언어코드에 해당하는 상품의 설명입니다.
                  description: 사용자에게 상품을 효과적으로 표현하고 상품의 특징을 알 수 있는 설명을 다국어로 지정합니다.
                displayOrder:
                  type: integer
                  description: section 내에서 노출할 순서를 지정합니다. 이미 게시된 상품을 기준으로 순서를 입력값에 맞춰 조정합니다. 미지정시 가장 첫 번째에 위치하게 됩니다.
                periodicType:
                  type: string
                  description: |-
                    (since 25.7.10) 계정당 구매 가능 수량 초기화 주기를 변경합니다. 판매 개시 이후에는 변경할 수 없습니다.
                    DAILY: 매일 초기화
                    WEEKLY: 매주 초기화
                    BI_WEEKLY: 격주 초기화
                    MONTHLY: 매달 초기화
                limitStockAmount:
                  $ref: '#/components/schemas/Long'
                  description: |-
                    총 재고의 수량을 제한할 사유가 있다면 지정합니다.
                    수량만큼의 구매가 발생하면 매진 상태로 노출되며 더 이상 구매를 할 수 없는 상태가 됩니다.
                    총 재고의 수량은 판매 도중이나 매진일 때에도 변경이 가능합니다.
                    미지정시 무제한으로 설정됩니다.
                limitPurchaseCount:
                  type: string
                  description: 한 계정당 구매할 수 있는 최대 개수를 지정합니다. periodicType을 이용해 기간별 구매 제한 개수를 초기화할 수 있습니다.
                limitMaxPurchasePerOnce:
                  type: string
                  description: 한번의 결제로 구매할 수 있는 최대 개수를 지정합니다. 판매가격이나 상품의 특성에 따라 수량을 조절해야 사용자가 구매하는 과정에서 불필요한 오류가 발생하지 않을 수 있습니다. 최대 개수는 50개입니다.
        required: true
        description: ''
