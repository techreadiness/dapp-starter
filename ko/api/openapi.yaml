openapi: 3.1.0
info:
  title: next-market-api
  version: 1.0.0
  description: integration next-market-api with game!
servers: []
paths:
  /api/v1/item:
    get:
      tags:
      - item
      summary: 아이템 목록 조회
      security:
      - Authorization: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                title: 아이템목록조회Ok
                required:
                - last
                - totalElements
                - pageNumber
                - content
                properties:
                  last:
                    type: boolean
                    examples:
                    - true
                    - false
                    description: 목록의 마지막 페이지인지 여부를 반환합니다.
                  content:
                    type: array
                    items:
                      type: object
                      required:
                      - sku
                      - imageUrl
                      - name
                      - description
                      properties:
                        sku:
                          type: string
                          examples:
                          - health-potion-large
                          - unique-armor-immortal
                          description: 조회한 SKU를 반환합니다.
                        name:
                          type: array
                          items:
                            type: object
                            required:
                            - contents
                            - lang
                            properties:
                              lang:
                                type: string
                                examples:
                                - en
                                - ko
                                description: |-
                                  ISO 639-1로 지정.
                                  예) ko, en, zh, th, ja.
                              contents:
                                type: string
                                examples:
                                - A unique armor imbued with legendary immortal power.
                                - Large Health Potion
                                description: 해당 언어로 표시할 이름입니다. 미지정시 기본 언어 또는 첫 번째 항목으로 대체됩니다.
                          description: 재화의 다국어 명칭
                        imageUrl:
                          type: string
                          examples:
                          - https://cdn.store.example.com/media/processed/potion_001.jpg
                          - https://cdn.store.example.com/media/processed/armor_001.jpg
                          description: 등록한 이미지의 URL을 반환합니다.
                        policies:
                          type: object
                          required: []
                          properties:
                            minPrice:
                              type: array
                              items:
                                type: object
                                required:
                                - price
                                - currency
                                properties:
                                  price:
                                    type: number
                                    format: double
                                    examples:
                                    - 10
                                    description: currency 기준 최소 금액을 지정합니다. Decimal Type 입니다.
                                  currency:
                                    type: string
                                    examples:
                                    - USD
                            blackList:
                              type: array
                              items:
                                type: string
                            whiteList:
                              type: array
                              items:
                                type: string
                        abilities:
                          type: array
                          items:
                            type: object
                            required:
                            - name
                            - optionType
                            - unitType
                            - value
                            properties:
                              name:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - lang
                                  - contents
                                  properties:
                                    lang:
                                      type: string
                                      examples:
                                      - ko
                                      - en
                                      description: 언어 코드 ex) en, ko, zh, ja, th
                                    contents:
                                      type: string
                                      examples:
                                      - speed
                                      description: 언어 코드에 해당하는 이름을 지정합니다.
                                description: 능력치의 이름을 지정합니다.
                              value:
                                type: number
                                format: double
                                examples:
                                - 10
                                description: 표시할 기본 능력 수치를 지정합니다. Decimal Type 입니다.
                              unitType:
                                enum:
                                - NONE
                                - PERCENTAGE
                                - NUMERIC
                                - LEVEL
                                type: string
                                default: NONE
                                examples:
                                - PERCENTAGE
                                description: |-
                                  능력치를 어떤 형식으로 표현할지를 결정하여 지정합니다.

                                  NONE: 입력한 수치 그대로 노출

                                  PERCENTAGE: 100% 형식의 표시

                                  NUMERIC: +100 형식으로 표시

                                  LEVEL: 100Lv 형식으로 표시


                                  예시는 abilities.value의 값을 100으로 지정했을 때 형식입니다.
                              optionType:
                                enum:
                                - BASIC
                                - CONTRAINT
                                - AMOUNT
                                type: string
                                default: BASIC
                                examples:
                                - BASIC
                                description: "능력치의 옵션 분류를 지정합니다. 옵션 분류에 따라 표기 위치가 달라집니다.\n\nBASIC: 기본 능력치\n\nCONTRAINT: 제약 옵션 \n\n예) 레벨제한\n\nAMOUNT: 아이템에 포함된 수량"
                          description: 아이템이 가지는 기본 능력치를 지정합니다. 소모성 아이템의 경우는 지정할 필요없으며 변형되지 않은 아이템의 기본 능력치로서 표시됩니다.
                        description:
                          type: array
                          items:
                            type: object
                            required:
                            - lang
                            - contents
                            properties:
                              lang:
                                type: string
                                examples:
                                - ko
                                - en
                                description: |-
                                  ISO 639-1로 지정.
                                  예) ko, en, zh, th, ja.
                              contents:
                                type: string
                                examples:
                                - A powerful potion that restores a large amount of health.
                                - A unique armor imbued with legendary immortal power.
                                description: 언어 코드에 해당하는 문자열을 지정합니다.
                          description: 사용자에게 표시할 재화에 대한 설명을 다국어로 지정합니다.
                        subItemList:
                          type: array
                          items:
                            type: object
                            required:
                            - sku
                            - amount
                            - name
                            - description
                            - policies
                            properties:
                              sku:
                                type: string
                                description: 패키지에 포함된 품목의 SKU입니다.
                              name:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - lang
                                  - contents
                                  properties:
                                    lang:
                                      type: string
                                      description: |-
                                        ISO 639-1로 지정.
                                        예) ko, en, zh, th, ja.
                                    contents:
                                      type: string
                                      description: 해당 언어로 표시할 이름입니다. 미지정시 기본 언어 또는 첫 번째 항목으로 대체됩니다.
                                description: 재화의 다국어 명칭
                              amount:
                                type: integer
                                examples:
                                - 10
                                description: 해당 SKU의 수량입니다.
                              policies:
                                type: object
                                required:
                                - whiteList
                                - blackList
                                - minPrice
                                properties:
                                  minPrice:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - price
                                      - currency
                                      properties:
                                        price:
                                          $ref: '#/components/schemas/Decimal'
                                        currency:
                                          type: string
                                          examples:
                                          - USD
                                          description: 최소금액을 지정할 화폐 유형을 지정합니다. ex) TWD, USD, USDT
                                  blackList:
                                    type: array
                                    items:
                                      type: string
                                    description: 아이템 판매, 구매, 노출 등을 허용하지 않을 국가를 지정합니다. 미지정시 사용할 수 없으며 whiteList와 혼용할 수 없습니다.
                                  whiteList:
                                    type: array
                                    items:
                                      type: string
                                    description: 아이템 판매, 구매, 노출 등을 허용할 국가를 지정합니다. 미지정시 전체 허용이며 blackList와 혼용할 수 없습니다.
                              description:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - contents
                                  - lang
                                  properties:
                                    lang:
                                      type: string
                                      description: |-
                                        ISO 639-1로 지정.
                                        예) ko, en, zh, th, ja.
                                    contents:
                                      type: string
                                      description: 언어 코드에 해당하는 문자열을 지정합니다.
                          description: 패키지 형태로 등록된 경우 반환합니다.
                    description: 등록된 아이템이 없다면 빈 리스트를 반환합니다.
                  pageNumber:
                    type: integer
                    examples:
                    - 1
                    - 0
                    description: 조회한 페이지의 번호를 반환합니다.
                  totalElements:
                    type: integer
                    examples:
                    - 10
                    description: 목록의 총 수량을 반환합니다.
          description: The request was successful, and the server has returned the requested resource in the response body.
      parameters:
      - in: query
        name: page
        style: form
        schema:
          type: integer
        explode: true
        required: true
        description: 0부터 시작하는 페이지
        allowReserved: false
      - in: query
        name: size
        style: form
        schema:
          type: integer
        explode: true
        required: true
        description: |-
          한번에 조회할 수 있는 페이지 크기입니다
          최대 100까지 지정할 수 있고 기본값은 50입니다.
        allowReserved: false
      - in: header
        name: Content-Type
        style: simple
        schema:
          type: string
        explode: false
        required: true
        description: application/json
        allowReserved: false
      description: 등록한 아이템의 목록을 반환합니다.
      operationId: 아이템목록조회
    post:
      tags:
      - item
      summary: '아이템 등록 '
      security:
      - Authorization: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: 'null'
                title: 아이템등록Ok
          description: <응답 본문이 비어있습니다.>
      parameters: []
      description: |-
        `preview` `prod`

        게임 내 재화로서 스토어에서 표현하고 판매 가능하도록 품목코드(SKU)를 등록하는 과정입니다. 등록된 재화는 개별 아이템으로 단일 재화로 치환 가능한 품목과 여러 재화로 풀어볼 수 있는 품목을 각각 등록할 수 있습니다.

        sku 등록 시에 언더바 `_`  구분자는 사용이 불가하며, 하이픈 `-` 사용을 권장합니다.
      operationId: 아이템등록
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sku
              - imageUrl
              - name
              - description
              properties:
                sku:
                  type: string
                  examples:
                  - test
                  description: |-
                    품목코드
                    동일한 품목코드는 재등록 불가하며 입력된 아이템의 품목코드를 변경할 수 없습니다.
                name:
                  type: array
                  items:
                    type: object
                    required:
                    - lang
                    - contents
                    properties:
                      lang:
                        type: string
                        examples:
                        - ko
                        - en
                        - zh
                        - th
                        - ja
                        description: ISO 639-1로 지정.
                      contents:
                        type: string
                        examples:
                        - Immortal Unique Armor
                        description: 해당 언어로 표시할 이름입니다. 미지정시 기본 언어 또는 첫 번째 항목으로 대체됩니다.
                  description: 사용자에게 표시할 재화명을 다국어로 지정합니다.
                imageUrl:
                  type: string
                  examples:
                  - https://cdn.store.example.com/media/processed/armor_001.jpg
                  description: 미디어 파일 업로드를 통해 반환받은 URL을 지정합니다. 정방형 최소 128x128 크기의 이미지를 권장합니다.
                policies:
                  type: object
                  required: []
                  properties:
                    minPrice:
                      type: array
                      items:
                        type: object
                        required:
                        - price
                        - currency
                        properties:
                          price:
                            type: integer
                            format: int32
                            examples:
                            - 10
                            description: currency 기준 최소 금액을 지정합니다. Decimal type 이어야 합니다.
                          currency:
                            type: string
                            examples:
                            - USD
                            description: 최소금액을 지정할 화폐 유형을 지정합니다. ex) TWD, USD, USDT
                      description: C2C 최소 판매가를 제한하는 정책을 추가할 수 있습니다.
                    blackList:
                      type: array
                      items:
                        type: string
                      description: 아이템 판매, 구매, 노출 등을 허용하지 않을 국가를 지정합니다. 미지정시 사용할 수 없으며 whiteList와 혼용할 수 없습니다.
                    whiteList:
                      type: array
                      items:
                        type: string
                      description: 아이템 판매, 구매, 노출 등을 허용할 국가를 지정합니다. 미지정시 전체 허용이며 blackList와 혼용할 수 없습니다.
                  description: 아이템에 세부 정책을 추가할 수 있습니다.
                abilities:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    - optionType
                    - unitType
                    - value
                    properties:
                      name:
                        type: array
                        items:
                          type: object
                          required:
                          - lang
                          - contents
                          properties:
                            lang:
                              type: string
                              examples:
                              - en
                              description: 언어 코드 ex) en, ko, zh, ja, th
                            contents:
                              type: string
                              description: 언어 코드에 해당하는 이름을 지정합니다.
                        description: 능력치의 이름을 지정합니다.
                      value:
                        $ref: '#/components/schemas/Decimal'
                      unitType:
                        enum:
                        - NONE
                        - PERCENTAGE
                        - NUMERIC
                        - LEVEL
                        type: string
                        default: NONE
                        examples:
                        - PERCENTAGE
                        description: |-
                          능력치를 어떤 형식으로 표현할지를 결정하여 지정합니다.

                          NONE: 입력한 수치 그대로 노출

                          PERCENTAGE: 100% 형식의 표시

                          NUMERIC: +100 형식으로 표시

                          LEVEL: 100Lv 형식으로 표시


                          예시는 abilities.value의 값을 100으로 지정했을 때 형식입니다.
                      optionType:
                        enum:
                        - BASIC
                        - CONTRAINT
                        - AMOUNT
                        type: string
                        default: BASIC
                        examples:
                        - BASIC
                        description: "능력치의 옵션 분류를 지정합니다. 옵션 분류에 따라 표기 위치가 달라집니다.\n\nBASIC: 기본 능력치\n\nCONTRAINT: 제약 옵션 \n\n예) 레벨제한\n\nAMOUNT: 아이템에 포함된 수량"
                  description: 아이템이 가지는 기본 능력치를 지정합니다. 소모성 아이템의 경우는 지정할 필요없으며 변형되지 않은 아이템의 기본 능력치로서 표시됩니다.
                description:
                  type: array
                  items:
                    type: object
                    required:
                    - lang
                    - contents
                    properties:
                      lang:
                        type: string
                        examples:
                        - ko
                        - en
                        description: |-
                          ISO 639-1로 지정.
                          예) ko, en, zh, th, ja.
                      contents:
                        type: string
                        examples:
                        - A unique armor imbued with legendary immortal power.
                        description: 언어 코드에 해당하는 문자열을 지정합니다.
                  description: 사용자에게 표시할 재화에 대한 설명을 다국어로 지정합니다.
                subItemList:
                  type: array
                  items:
                    type: object
                    required:
                    - sku
                    - amount
                    properties:
                      sku:
                        type: string
                        examples:
                        - subItem
                        description: 하위 SKU는 이전에 아이템으로 미리 등록되어 있어야 합니다.
                      amount:
                        type: integer
                        examples:
                        - 10
                        description: 패키지에 포함되는 아이템의 수량을 지정합니다.
                  description: 패키지 형태로 다수의 아이템을 포함하는 재화의 경우에만 지정합니다.
        required: true
        description: ''
  /api/v1/sale/b2c:
    get:
      tags:
      - sale
      summary: 판매 목록 조회
      security:
      - Authorization: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                title: 판매목록조회Ok
                required:
                - last
                - pageNumber
                - totalElements
                - content
                - multiCurrencyPrice
                properties:
                  last:
                    type: boolean
                    examples:
                    - true
                    - false
                    description: 마지막 페이지 여부
                  content:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - itemList
                      - title
                      - description
                      - refundType
                      - status
                      - mediaType
                      - mediaUrl
                      - limitPurchaseCount
                      - limitMaxPurchasePerOnce
                      - periodType
                      - periodicType
                      - openedAt
                      - closedAt
                      - sectionId
                      - displayOrder
                      - phase
                      - multiCurrencyPrice
                      properties:
                        id:
                          $ref: '#/components/schemas/Long'
                          description: 상품의 식별자로 추후 링크 이동 등에서 대상 상품을 특정해서 파라미터로 사용할 수 있습니다.
                        phase:
                          enum:
                          - READY_FOR_SALE
                          - ON_SALE
                          - CLOSED
                          type: string
                          default: READY_FOR_SALE
                          examples:
                          - READY_FOR_SALE
                          description: |-
                            현재 판매 상품의 판매 기간 상태를 반환합니다.
                            READY_FOR_SALE: 상품의 판매 시작 시각 이전
                            ON_SALE: 상품 판매 중
                            CLOSED: 상품 판매 시각 이후 종료된 상태
                        price:
                          $ref: '#/components/schemas/BigDecimal'
                          description: (deprecated 25.7.10) 등록한 상품의 가격입니다.
                        title:
                          type: array
                          items:
                            type: object
                            required:
                            - lang
                            - contents
                            properties:
                              lang:
                                type: string
                                description: 언어코드(en,ko,ja,th,zh)입니다.
                              contents:
                                type: string
                                description: 언어코드에 해당하는 상품의 이름입니다.
                          description: 사용자에게 노출할 판매 상품의 이름을 다국어로 지정합니다.
                        status:
                          enum:
                          - ACTIVE
                          - INACTIVE
                          type: string
                          default: ACTIVE
                          examples:
                          - ACTIVE
                          description: |-
                            현재 판매 상품의 활성화 상태를 반환합니다.
                            ACTIVE: 상품이 활성화 되어있음
                            INACTIVE: 상품이 비활성화 된 상태
                        resetAt:
                          $ref: '#/components/schemas/Timestamp'
                          description: 설정한 periodicType의 초기화 주기를 실행할 기준 일시입니다.
                        closedAt:
                          $ref: '#/components/schemas/Timestamp'
                          description: 판매를 종료할 시간입니다. 판매가 종료되면 해당 상품은 더 이상 노출되지 않으며, 종료 직전에 구매를 시도한 경우 판매 종료 이후에도 구매가 될 수 있습니다.
                        itemList:
                          type: array
                          items:
                            type: object
                            required:
                            - sku
                            - amount
                            - imageUrl
                            - name
                            - description
                            properties:
                              sku:
                                type: string
                                description: 품목코드입니다.
                              name:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - lang
                                  - contents
                                  properties:
                                    lang:
                                      type: string
                                      description: 언어코드(en,ko,ja,th,zh)입니다.
                                    contents:
                                      type: string
