                  description: IMAGE/VIDEO
                startedAt:
                  type: string
                  description: |-
                    미션을 시작할 일시
                    미션을 게시할 기간이 지정되면 해당 기간에만 미션 달성 처리가 됩니다. 이전에 달성한 이벤트는 무시됩니다.
                achievement:
                  type: object
                  required: []
                  properties:
                    count:
                      type: integer
                      description: |-
                        도달해야 하는 업적의 수량
                        재화 획득 10회라면 10으로 지정하고 재화 획득 업적 이벤트에서 10으로 수신하면 달성이 됩니다.
                    missionIds:
                      type: array
                      items:
                        $ref: '#/components/schemas/Long'
                      description: |-
                        달성목표 미션 목록
                        missionType이 CHALLENGE인 경우 달성해야 완수할 수 있는 대상 missionId 목록을 지정합니다.
                        지정한 목록의 미션들이 각기 모든 회차까지 완료되어야 챌린지 미션이 될성된 것으로 판단하므로 무한 반복으로 지정된 경우 완수할 수 없게 되므로 주의가 필요합니다.
                    difficulties:
                      type: array
                      items:
                        type: integer
                      description: |-
                        회차별 난이도 설정
                        missionType을 DIFFICULTY로 지정한 경우 round 수만큼 미션의 달성 업적 수량을 지정합니다.
                        레벨 달성 구간 70, 90, 100, 105 라면 [70, 90, 100, 105]로 지정하고 round를 4로 지정합니다. 획득 업적 이벤트에서 95를 수신하면 70과 90의 미션이 달성됩니다.
                  description: 미션 달성 목표를 지정합니다.
                description:
                  type: array
                  items:
                    type: object
                    required:
                    - lang
                    - contents
                    properties:
                      lang:
                        type: string
                        examples:
                        - en
                        description: "\t언어코드(en,ko,ja,th,zh)입니다."
                      contents:
                        type: string
                        examples:
                        - mission description
                        description: 미션 설명입니다.
                  description: 사용자에게 노출할 미션을 달성할 조건이나 소개의 내용
                missionType:
                  type: string
                  description: |-
                    미션의 유형
                    SINGLE: 단일 목표 달성 형태로 달성될 때마다 보상을 획득할 수 있고 회자 지정의 경우 매번 초기화됩니다.

                    ACCUMULATE: 누적 목표 달성 형태로 일정 수치까지 도달하면 보상, 회차 지정의 경우 이전 달성치가 유지된 상태에서 누적 달성량이 증가합니다.

                    DIFFICULTY: 회차별로 미션 난이도가 변화하도록 지정합니다. 회차와 난이도 설정의 횟수가 맞지 않으면 초기 설정 난이도로 회귀합니다.

                    CHALLENGE: 진행 중인 미션들을 컬렉션으로 설정하여 지정한 미션들이 모두 달성되어야 같이 달성이 되어 보상받을 수 있게 됩니다.
                allowControlType:
                  type: string
                  description: 기본값은 BLACKLIST로 controlledCountries 필드의 국가를 지정하지 않으면 모든 국가에서 참여 가능 (WHITELIST, BLACKLIST)
                controlledCountries:
                  type: string
                  description: ISO 3166-1 alpha-2의 2자리 대문자로 표현하는 국가 코드의 목록
        required: true
        description: ''
    delete:
      tags:
      - mission
      summary: 미션 제거
      security:
      - Authorization: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: 'null'
                title: 미션제거Ok
          description: The request was successful, and the server has returned the requested resource in the response body.
      parameters:
      - $ref: '#/components/parameters/missionId'
      description: |
        `preview` `prod`

        설정된 미션을 목록에서 제거합니다. 잘못 생성되었거나 더 이상 유지할 이유가 없어진 지난 미션 또는 진행 중인 미션을 즉시 종료 처리해야 하는 긴급사항에서 실행합니다. 내부적으로 데이터가 삭제되지 않으며 사용자 노출이나 미션 보드의 목록 조회 결과에서만 제외됩니다.

        missionId 로는 미션 등록 결과 반환이나 미션 목록 조회에서 확인 가능한 등록된 미션의 식별자를 지정합니다.
      operationId: 미션제거
components:
  schemas:
    File:
      type: object
      required: []
      properties:
        file:
          type: string
    Long:
      type: integer
      format: int64
      examples:
      - 10
    item:
      type: object
      required:
      - sku
      - imageUrl
      - name
      - description
      properties:
        sku:
          type: string
        name:
          type: array
          items:
            type: object
            required: []
            properties:
              lang:
                type: string
              contents:
                type: string
        imageUrl:
          type: string
        policies:
          type: object
          required:
          - minPrice
          properties:
            minPrice:
              type: array
              items:
                type: object
                required:
                - price
                - currency
                properties:
                  price:
                    $ref: '#/components/schemas/Decimal'
                  currency:
                    type: string
            blackList:
              type: array
              items:
                type: string
            whiteList:
              type: array
              items:
                type: string
        abilities:
          type: object
          required:
          - name
          - optionType
          - unitType
          - value
          properties:
            name:
              type: array
              items:
                type: object
                required:
                - lang
                - contents
                properties:
                  lang:
                    type: string
                  contents:
                    type: string
            value:
              $ref: '#/components/schemas/Decimal'
            unitType:
              enum:
              - NONE
              - PERCENTAGE
              - NUMERIC
              - LEVEL
              type: string
              default: NONE
              description: |-
                능력치를 어떤 형식으로 표현할지를 결정하여 지정합니다.

                NONE: 입력한 수치 그대로 노출

                PERCENTAGE: 100% 형식의 표시

                NUMERIC: +100 형식으로 표시

                LEVEL: 100Lv 형식으로 표시


                예시는 abilities.value의 값을 100으로 지정했을 때 형식입니다.
            optionType:
              enum:
              - BASIC
              - CONTRAINT
              - AMOUNT
              type: string
              default: BASIC
              description: "능력치의 옵션 분류를 지정합니다. 옵션 분류에 따라 표기 위치가 달라집니다.\n\nBASIC: 기본 능력치\n\nCONTRAINT: 제약 옵션 \n\n예) 레벨제한\n\nAMOUNT: 아이템에 포함된 수량"
        description:
          type: array
          items:
            type: object
            required:
            - lang
            - contents
            properties:
              lang:
                type: string
              contents:
                type: string
        subItemList:
          type: array
          items:
            type: object
            required:
            - sku
            - amount
            properties:
              sku:
                type: string
              amount:
                type: string
      description: ''
    Price:
      type: object
      required:
      - price
      properties:
        price:
          type: object
          required:
          - value
          - currencyCode
          - decimalScale
          - exchangedPrices
          properties:
            value:
              $ref: '#/components/schemas/BigDecimal'
            currencyCode:
              type: string
              examples:
              - TWD
              - USD
              - USDT
              description: |-
                결제 화폐 유형.
                ex) TWD, USD, USDT
            decimalScale:
              type: integer
              description: 소수점 처리 기준 자리수
            exchangedPrices:
              type: array
              items:
                type: object
                required:
                - value
                - currencyCode
                - decimalScale
                properties:
                  value:
                    $ref: '#/components/schemas/BigDecimal'
                    description: 금액
                  currencyCode:
                    type: string
                    examples:
                    - TWD
                    - USD
                    - USDT
                    description: |-
                      결제 화폐 유형.
                      ex) TWD, USD, USDT
                  decimalScale:
                    type: integer
                    description: 소수점 처리 기준 자리수
              description: USD, KRW 환산가 정보
      description: ''
    Author:
      type: object
      required:
      - id
      - name
      - address
      - city
      - numberOfBooksPublished
      properties:
        id:
          type: integer
          examples:
          - 1
          - 2
          - 3
        city:
          type: string
          examples:
          - New York
          - Boston
        name:
          type: string
          examples:
          - J.K. Rowling
          - Henry Miller
        address:
          type: string
          examples:
          - Lorem ipsum
        numberOfBooksPublished:
          type: string
          examples:
          - '1'
          - '3'
          - '10'
      description: Creator of books.
    Decimal:
      type: number
      format: double
    Timestamp:
      type: integer
      format: int64
      examples:
      - 1738368000000
      - 1735689600000
      description: Unix timestamp in seconds
    BigDecimal:
      type: number
      format: double
      description: 정수의 자리수는 15자리, 소수의 자리수는 10 까지 가능합니다.
  responses:
    Conflict:
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
                examples:
                - Lorem ipsum
      description: The request could not be completed due to a conflict with the current state of the resource. Resolve the conflict and try again.
    NotFound:
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
                examples:
                - Lorem ipsum
      description: The server cannot find the requested resource. The endpoint may be invalid or the resource may no longer exist.
    BadRequest:
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
                examples:
                - Lorem ipsum
      description: The server could not understand the request due to invalid syntax. The client should modify the request and try again.
    InternalServerErrror:
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
                examples:
                - Lorem ipsum
      description: The server encountered an unexpected condition that prevented it from fulfilling the request. Report the issue to the support team if it persists.
  parameters:
    sku:
      in: path
      name: sku
      schema:
        type: string
      required: true
    code:
      in: path
      name: code
      schema:
        type: string
      required: true
    guid:
      in: path
      name: guid
      schema:
        type: string
      required: true
    b2cSaleId:
      in: path
      name: b2cSaleId
      schema:
        type: string
      required: true
    c2cSaleId:
      in: path
      name: c2cSaleId
      schema:
        type: integer
      required: true
    missionId:
      in: path
      name: missionId
      schema:
        type: string
      required: true
    sectionId:
      in: path
      name: sectionId
      schema:
        type: integer
      required: true
    Content-Type:
      in: header
      name: Content-Type
      style: simple
      schema:
        type: string
      explode: false
      description: application/json
      allowReserved: false
      allowEmptyValue: true
  securitySchemes:
    Authorization:
      in: header
      name: Authorization
      type: apiKey
      description: Basic `Base64<API key>`
tags:
- name: item
- name: section
- name: sale
- name: account
- name: delivery
- name: settlement
- name: mission
