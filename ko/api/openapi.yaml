                  type: array
                  items:
                    type: object
                    required:
                    - guid
                    - eventKey
                    - progress
                    - achievedAt
                    properties:
                      cuid:
                        type: string
                        description: 업적을 달성한 캐릭터의 cuid를 지정합니다.
                      guid:
                        type: string
                        description: 업적을 달성한 계정의 guid를 지정합니다.
                      eventKey:
                        type: string
                        description: 달성한 업적의 이벤트키를 지정합니다.
                      progress:
                        type: integer
                      achievedAt:
                        $ref: '#/components/schemas/Timestamp'
                        description: Unix timestamp로 진행수치에 해당하는 이벤트가 발생한 시점을 지정합니다. 동일 eventKey로 수신한 이력보다 과거의 요청을 받으면 무시합니다.
                  description: 달성한 업적을 목록으로 일괄 요청하며 최대 100개까지 지정할 수 있습니다.
