      description: |-
        `preview` `prod`

        업적을 달성한 경우 미션상태 갱신을 위해 요청 합니다. 누가 언제 어떤 업적을 얼마나 달성했는지 스토어에 알려주게 되며 하나의 업적의 결과로 동일 미션의 여러 회차가 동시에 달성될 수 있으며 여러 미션이 한번에 달성될 수 있습니다. idempotent한 동작이므로 중복 요청하더라도 중복해서 미션이 달성되지는 않습니다. 동시 요청량 제어나 타임아웃 발생 등으로 요청을 완료하지 못했다면 일정 시간의 지연 후 재발송하여 미션상태를 동기화할 수 있도록 하는 것을 권장합니다.
      operationId: 업적달성기록
      requestBody:
        content:
          application/json:
