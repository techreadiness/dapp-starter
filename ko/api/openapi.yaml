                    description: 등록된 상품의 한 계정당 구매할 수 있는 최대 개수입니다. periodType을 이용해 기간별 구매 제한 개수를 초기화할 수 있습니다.
                  multiCurrencyPrice:
                    type: object
                    description: (since 25.7.10) 등록한 상품의 통화와 가격입니다.
                  limitMaxPurchasePerOnce:
                    type: integer
                    description: 등록된 상품의 한번의 결제로 구매할 수 있는 최대 개수입니다. 판매가격이나 상품의 특성에 따라 수량을 조절해야 사용자가 구매하는 과정에서 불필요한 오류가 발생하지 않을 수 있습니다. 최대 개수는 50개입니다.
                  nonRefundableCountryList:
                    type: array
                    items:
                      type: string
                    description: PARTIALLY_REFUNDABLE 환불 정책 일 때 환불이 불가능한 국가의 목록입니다.
          description: The request was successful, and the server has returned the requested resource in the response body.
      parameters:
      - in: header
        name: Content-Type
        style: simple
        schema:
          type: string
        explode: false
        required: true
        description: application/json
        allowReserved: false
      description: |-
        `preview` `prod`

        B2C 판매를 등록합니다. 판매 일정에 따라 사용자에게 공개되며 공개된 이후에는 즉시 판매가 이루어지므로 변경에 제한이 있으므로 판매 게시 일시를 신중하게 결정해야 합니다. 무료 판매인 경우에 가격을 0으로 지정하여 별도의 결제 절차 없이 사용자가 수령할 수 있게 됩니다. 판매 등록 이전에 스토어의 섹션을 미리 설정해 두어 진열 위치를 파악할 필요가 있습니다.

        판매 등록 요청 전에 섹션을 먼저 설정해야 하며 1개 이상의 섹션을 설정한 후 sectionId 값을 미입력하면 첫 번째 섹션에 자동 할당됩니다.

        * NEXT Market에서는 판매상품의 가격 할인 서비스를 제공하고 있습니다. 기존 판매가에 할인율을 적용하고, 할인 중인 상태를 유저에게 안내할 수 있으며 구현을 위해서는 판매상품 등록 후 NEXT Market 담당자와 협의를 통해 적용할 수 있습니다.
      operationId: 판매등록
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - requestId
              - itemList
              - title
              - description
              - currencyType
              - setRefundablePolicy
              - mediaType
              - mediaUrl
              - limitMaxPurchasePerOnce
              - openedAt
              - closedAt
              - multiCurrencyPrice
              properties:
                price:
                  $ref: '#/components/schemas/BigDecimal'
                  description: (deprecated 25.7.10) 상품의 가격을 입력하며, 무료로 증정할 상품인 경우 0을 지정합니다. 정수의 자리수는 15자리, 소수의 자리수는 10 까지 가능합니다.
                title:
                  type: array
                  items:
                    type: object
                    required:
                    - lang
                    - contents
                    properties:
                      lang:
                        type: string
                        examples:
                        - en
                        - ko
                        description: 언어코드(en,ko,ja,th,zh)입니다.
                      contents:
                        type: string
                        examples:
                        - Special Limited Immortal Armor Package
                        description: 언어코드에 해당하는 상품의 이름입니다.
                  description: 사용자에게 노출할 판매 상품의 이름을 다국어로 지정합니다.
                resetAt:
                  $ref: '#/components/schemas/Timestamp'
                  description: |-
                    periodicType의 초기화 주기를 실행할 기준 일시를 지정합니다. Timestamp 특성상 타임존의 영향이 없으므로 목표 국가에 맞게 지정하면 됩니다. openedAt보다 같거나 이전으로 설정해야 합니다.

                    example : 2025-01-01 10:00 (수요일)

                    DAILY : 매일 10시에 초기화됩니다.

                    WEEKLY: 매주 수요일 10시에 초기화됩니다.

                    BI_WEEKLY: 격주 수요일 10시에 초기화됩니다.

                    MONTHLY: 매달 1일 10시에 초기화됩니다.
                closedAt:
                  $ref: '#/components/schemas/Timestamp'
                  description: 판매 종료할 시간을 지정합니다. 판매가 종료되면 해당 상품은 더 이상 노출되지 않으며, 종료 직전에 구매를 시도한 경우 판매 종료 이후에도 구매가 될 수 있습니다.
                itemList:
                  type: array
                  items:
                    type: object
                    required:
                    - sku
                    - amount
                    properties:
                      sku:
                        type: string
                        examples:
                        - unique-armor-immortal
                        description: 판매할 아이템의 SKU를 지정합니다.
                      amount:
                        type: integer
                        examples:
                        - 2
                        description: 한건의 구매에서 지정한 아이템을 몇개 입수할 수 있는지 수량을 지정합니다.
                  description: 판매할 아이템을 1개 이상 지정하여 등록하며 지정 SKU 수량만큼의 배송요청이 발생합니다.
                mediaUrl:
                  type: string
                  examples:
                  - https://cdn.store.example.com/media/processed/package_immortal_armor.jpg
                  description: |-
                    상품의 커버 이미지 또는 영상의 URL을 "미디어 파일 업로드" 기능을 이용해 반환받은 URL을 지정합니다.
                    레티나, PC모드 지원을 위해 정방형 944 x 944 이상으로 등록하는 것을 권장합니다.
                openedAt:
                  $ref: '#/components/schemas/Timestamp'
                  description: 판매 게시할 시간을 예약합니다. 가급적 하루 정도의 유예기간을 두어 미래 시간을 예약을 하며, 급하게 설정할 필요가 있다면 협의가 필요합니다.
                mediaType:
                  enum:
                  - VIDEO
                  - IMAGE
                  type: string
                  default: IMAGE
                  examples:
                  - IMAGE
                  description: 상품 커버로 등록할 대상의 유형을 지정합니다. (VIDEO, IMAGE)
                requestId:
                  type: string
                  examples:
                  - sale-req-2025-001
                  description: 요청의 유일성을 보장하기 위한 5~36자 이내의 요청키, 중복요청이 발생하지 않도록 동일 판매에 대해서는 항상 동일 요청키로 지정해야 합니다.
                sectionId:
                  $ref: '#/components/schemas/Long'
                  description: 스토어에 설정한 section의 식별자를 지정하면 해당 영역에 게시됩니다. 미지정시 가장 첫 번째 섹션의 가장 첫 번째에 위치하게 됩니다.
                periodType:
                  enum:
                  - DAILY
                  - WEEKLY
                  - BI_WEEKLY
                  - MONTHLY
                  type: string
                  default: DAILY
                  examples:
                  - DAILY
                  description: |-
                    (deprecated 25.7.10) 계정당 구매 가능 수량을 기간마다 초기화할 수 있도록 제공합니다. resetAt에 기준 일시를 지정하면 해당 일시를 기준으로 설정된 기간마다 초기화가 됩니다.

                    DAILY: 매일 초기화

                    WEEKLY: 매주 초기화

                    BI_WEEKLY: 격주 초기화

                    MONTHLY: 매달 초기화
                description:
                  type: array
                  items:
                    type: object
                    required:
                    - lang
                    - contents
                    properties:
                      lang:
                        type: string
                        examples:
                        - ko
                        - en
                        description: 언어코드(en,ko,ja,th,zh)입니다.
                      contents:
                        type: string
                        examples:
                        - A special limited package containing legendary immortal armor.
                        description: 언어코드에 해당하는 상품의 설명입니다.
                  description: 사용자에게 상품을 효과적으로 표현하고 상품의 특징을 알 수 있는 설명을 다국어로 지정합니다.
                currencyType:
                  type: string
                  examples:
                  - USD
                  description: (deprecated 25.7.10) 상품의 가격 통화를 설정합니다. (TWD) 지원 통화는 계속 추가될 수 있습니다.
                displayOrder:
                  type: integer
                  examples:
                  - 2
                  description: section 내에서 노출할 순서를 지정합니다. 이미 게시된 상품을 기준으로 순서를 입력값에 맞춰 조정합니다. 미지정시 가장 첫 번째에 위치하게 됩니다.
                periodicType:
                  enum:
                  - DAILY
                  - WEEKLY
                  - BI_WEEKLY
                  - MONTHLY
                  type: string
                  default: DAILY
                  examples:
                  - DAILY
                  description: |-
                    (since 25.7.10) 계정당 구매 가능 수량을 기간마다 초기화할 수 있도록 제공합니다. resetAt에 기준 일시를 지정하면 해당 일시를 기준으로 설정된 기간마다 초기화가 됩니다.

                    DAILY: 매일 초기화

                    WEEKLY: 매주 초기화

                    BI_WEEKLY: 격주 초기화

                    MONTHLY: 매달 초기화
                limitStockAmount:
                  $ref: '#/components/schemas/Long'
                  description: |-
                    총 재고의 수량을 제한할 사유가 있다면 지정합니다.
                    수량만큼의 구매가 발생하면 매진 상태로 노출되며 더 이상 구매를 할 수 없는 상태가 됩니다.
                    총 재고의 수량은 판매 도중이나 매진일 때에도 변경이 가능합니다.
                    미지정시 무제한으로 설정됩니다.다.
                limitPurchaseCount:
                  type: integer
                  examples:
                  - 10
                  description: 한 계정당 구매할 수 있는 최대 개수를 지정합니다. periodicType을 이용해 기간별 구매 제한 개수를 초기화할 수 있습니다. 미지정시 무제한 구매가 가능한 상태가 됩니다.
                multiCurrencyPrice:
                  type: object
                  description: |-
                    (since 25.7.10) 제공할 상품의 통화와 가격을 입력합니다. 정수는 15자리, 소수는 10자리까지 가능합니다.
                    예:
                    - USD 10$, TWD 200NT$ 판매 시 → {"USD": 10, "TWD": 200}
                    - 무료 상품 지정 시 (제공할 통화 모두 0으로 지정) → {"USD": 0, "TWD": 0}
                    - Map<String, BigDecimal> Type
                setRefundablePolicy:
                  enum:
                  - REFUNDABLE
                  - NON_REFUNDABLE
                  type: string
                  default: NON_REFUNDABLE
                  examples:
                  - NON_REFUNDABLE
                  description: |-
                    환불 유형을 선택하여 지정합니다. 환불과 관련해서는 미리 협의가 필요합니다.
                    REFUNDABLE : 모든 국가 혹은 일부 국가 환불 가능
                    NON_REFUNDABLE : 모든 국가 환불 불가능
                limitMaxPurchasePerOnce:
                  type: integer
                  examples:
                  - 2
                  description: 한번의 결제로 구매할 수 있는 최대 개수를 지정합니다. 판매가격이나 상품의 특성에 따라 수량을 조절해야 사용자가 구매하는 과정에서 불필요한 오류가 발생하지 않을 수 있습니다. 최대 개수는 50개입니다.
                nonRefundableCountryList:
                  type: array
                  items:
                    type: string
                  description: 환불 유형에 따라 환불가능(REFUNDABLE)로 설정한 경우 예외 국가를 목록으로 지정합니다.
        required: true
        description: ''
  /api/v1/auth/token:
    post:
      summary: 스토어 인증용 원타임 토큰 요청
      security:
      - Authorization: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                title: 스토어인증용원타임토큰요청Ok
                required:
                - token
                - expiresIn
                properties:
                  token:
                    type: string
                  expiresIn:
                    $ref: '#/components/schemas/Timestamp'
          description: The request was successful, and the server has returned the requested resource in the response body.
      parameters: []
      description: |-
        `preview` `prod`

        인게임에서 플레이 중인 사용자가 스토어에서 상품을 구매할 때 게임에서 인증된 사용자의 이동임을 증명하기 위한 토큰 발행 절차입니다. 발급 받은 token으로 이동하면 단 한번만 인증을 위해 사용하며 바로 만료 처리되어 재사용이 불가합니다. expiresIn에 지정된 유효한 일시를 초과한 경우에도 정상 인증 처리가 되지 않습니다.

        발급 받은 토큰은 스토어 경로로 이동할 링크를 생성할 때 이용하여 사용자에게 링크로 제공하거나 어떤 요청에 대해 리다이렉트할 주소로 사용하여 브라우저로 이동합니다. redirectPath 에 스토어 내에 이동할 경로를 지정하면 사용자는 인증된 사용자로서 해당 경로로 redirect 됩니다.

        `<a href="https://{store domain}/auth?token={one time token}" target="_blank">무료 아이템 받기</a>`

        스토어를 앱 내 WebView로 제공하는 경우에는 URL param으로 inapp=true를 추가해주셔야 합니다.
        앱 내 WebView에서 열릴 때만 한정하여 설정해야 합니다. (웹 페이지가 앱 내 WebView에서 열렸는지 식별하기 위함)
      operationId: 스토어인증용원타임토큰요청
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - guid
              - signature
              - region
              properties:
                c2c:
                  type: object
                  required:
                  - sku
                  properties:
                    sku:
                      type: string
                      description: C2C판매 등록할 아이템의 SKU 값을 지정합니다.
                    amount:
                      type: string
                      description: 판매등록할 아이템의 수량입니다. 미지정시 기본값 1로 지정되며 stackable한 속성을 가진 아이템의 경우에만 지정합니다. 아이템 실링/언실링/교환 요청에서 파라미터로 전달됩니다.
                    abilities:
                      type: array
                      items:
                        type: object
                        required:
                        - code
                        - value
                        properties:
                          code:
                            type: string
                            description: 능력치 설정에 입력했던 키를 지정합니다.
                          value:
                            $ref: '#/components/schemas/Decimal'
                      description: 고유 속성을 가진 아이템의 경우에만 지정합니다. 구매자가 판매하는 아이템의 가치를 인식할 수 있는 속성으로 선별해 지정할 수 있습니다.
                    serialNumber:
                      type: string
                      description: 고유속성을 가진 아이템의 게임 내부 식별값을 지정합니다. 아이템 실링/언실링/교환 요청에서 파라미터로 전달됩니다.
                  description: issueType이 C2C인 경우에만 지정합니다. 이 값으로 판매자와 구매자에게 표시할 정보를 게시합니다.
                guid:
                  type: string
                  description: 120자 이하
                region:
                  type: string
                  description: |-
                    플레이 중인 사용자의 소속 국가 정보, 접속한 스토어의 표현을 소속 국가에 맞춰서 노출. Sanction 국가는 실패하게 됩니다
                    ISO3166-1 alpha-2 (KR, JP, US, TW, TH, ...)
                payload:
                  type: string
                  description: |-
                    `preview `
                    2000자 미만의 자유형식의 text를 지정하며 배송 요청 때 해당 payload값이 같이 전달됩니다.
                presence:
                  type: string
                  description: |-
                    since 25/11/12 인증하려는 사용자의 현재 인게임 세션의 위치를 지정합니다.
                    숫자 또는 문자열로 50자 이내로 지정하며 사용자에게 직접 노출되지 않는 값입니다.
                    미지정하는 경우 presence의 기본값은 0이며 C2C 거래에서 상호 거래 가능한 그룹을 설정하기 위한 그룹에 포함되어 있어야 거래가 가능합니다.
                issueType:
                  type: string
                  description: |-
                    특별한 목적으로 토큰을 발행하는 경우에 지정합니다. issueType이 지정된 경우 redirectPath 입력은 무시됩니다.

                    C2C: C2C판매 등록을 위한 목적이며 해당 토큰으로 인증절차를 거치면 사용자는 C2C 등록 페이지로 이동합니다.
                signature:
                  type: array
                  items:
                    type: string
                redirectPath:
                  type: string
                  description: |-
                    인증된 사용자가 이동할 페이지의 경로를 지정합니다. ex)/c2c/selling?key=param
                    지정하지 않으면 홈으로 이동합니다.
                referralCode:
                  type: string
                  description: |-
                    preview 게임측에서 정의한 사용자의 추천코드를 지정합니다. KOL 또는 추천인의 추천코드로 100자 미만의 값으로 지정합니다.
                    최신 값으로 항상 갱신되므로 추천인 취소, 변경시 빈값으로 입력하거나 다른 값으로 지정하여 취소 또는 변경할 수 있습니다.
                    null 또는 필드 미지정시 변경되지 않거나 무시합니다.
        required: true
        description: ''
  /api/v1/item/{sku}:
    get:
      tags:
      - item
      summary: 아이템 조회
      security:
      - Authorization: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                title: 아이템조회Ok
                required:
                - sku
                - imageUrl
                - name
                - description
                properties:
                  sku:
                    type: string
