                            required:
                            - sku
                            - amount
                            - imageUrl
                            - name
                            - description
                            properties:
                              sku:
                                type: string
                                description: 품목코드입니다.
                              name:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - lang
                                  - contents
                                  properties:
                                    lang:
                                      type: string
                                      description: 언어코드(en,ko,ja,th,zh)입니다.
                                    contents:
                                      type: string
                                      description: 언어코드에 해당하는 아이템의 이름입니다.
